global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: "cadvisor"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "cadvisor:8080"


  - job_name: "spark-master"
    scrape_interval: 5s
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - "spark-master:8080"


  - job_name: "spark-worker"
    scrape_interval: 5s
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - "spark-worker:8081"


  - job_name: "spark-driver"
    scrape_interval: 2s
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - "spark-submit:4040"